<!DOCTYPE html>
<html lang=es dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta  name="description" content="Este es un documento HTML5">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <link rel="stylesheet" href="/css/master.css">
    <title>Test HTML</title>
  </head>
  <body>
    <header id="title">
      <h1>Este es el título</h1>
    </header>
    <nav>
      <h2>Inicio | Fotos | Videos | Contactos</h2>
    </nav>
    <main>
      <section>
        <article>Articulo 1</article>
        <article>Articulo 2</article>
        <article>Articulo 3</article>
        <article>Articulo 4</article>
        <br>
        <hr>
        <article>
          <table>
            <tr>
              <th colspan="2">Libro</th>
              <th>año</th>
            </tr>
            <tr>
              <td>IT</td>
              <td>Stephen King</td>
              <td>1986</td>
            </tr>
              <td>Carrie</td>
              <td>Stephen King</td>
              <td>1974</td>
            <tr>
            </tr>
            <tr>
              <td>El Resplandor</td>
              <td>Stephen King</td>
              <td>1977</td>
            </tr>
          </table>
        </article>
        <br>
        <hr>
        <article>
          <details>
            <summary>Familia</summary>
            <p>Daniel</p>
            <p>Gloria</p>
            <p>Simón</p>
          </details>
        </article>
        <br>
        <hr>
        <article>
          <form name="formulario" action="index.html" method="get">
            <fieldset>
              <legend>Básica</legend>
              <p>
                <label>Nombre: <input type="text" name="Nombre"></label>
              </p>
              <p>
                <label>Apellido: <input type="text" name="Apellido"></label>
              </p>
              <p>
                <label>Edad: <input type="number" name="Edad" min="18" max="120"></label>
              </p>
              <p>
                <label>Telefono: <input type="tel" name="Telefono"></label>
              </p>
              <p>
                <label>Correo: <input type="email" name="Correo"></label>
              </p>
              <p>
                <label>Fecha de nacimiento: <input type="date" name="Fecha_n"></label>
              </p>
              <p>
                <label>Volumen: <input type="range" name="Volumen" value="15" min="0" max="100"> </label>
              </p>
              <p><input type="submit"></p>
            </fieldset>
            <fieldset>
              <legend>Ubicación</legend>
              <p>
                <label>Pais: <input type="text" name="Pais"></label>
              </p>
              <p>
                <label>Ciudad: <input type="text" name="Ciudad"></label>
              </p>
              <p>
                <label>Barrio: <input type="text" name="Barrio"></label>
              </p>
              <p><input type="submit"></p>
            </fieldset>
            <fieldset>
              <legend>Gustos</legend>
              <p>
                <label>
                  Color: <input type="color" name="Color" value="#0000FF">
                </label>
              </p>
              <p>
                <label>
                  Libros:
                  <input type="radio" name="Gusto" value="Libros">
                </label>
                <label>
                  Películas:
                  <input type="radio" name="Gusto" value="Películas">
                </label>
                <label>
                  Música:
                  <input type="radio" name="Gusto" value="Música">
                </label>
                <label>
                  N/A
                  <input type="radio" name="Gusto" value="N/A" checked>
                </label>
              </p>
              <p>
                <label>
                  1
                  <input type="checkbox" name="1" value="1">
                </label>
                <label>
                  2
                  <input type="checkbox" name="2" value="2" checked>
                </label>
                <label>
                  3
                  <input type="checkbox" name="3" value="3" checked>
                </label>
              </p>
              <p><input type="submit"></p>
            </fieldset>
          </form>
        </article>
      </section>
      <aside>

      </aside>
    </main>
  </body>
</html>
